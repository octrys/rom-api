<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex;
         align-items: center; justify-content: center; background: #11151c; color: #e8eaed; }
  .card { width: 320px; max-width: calc(100vw - 32px); padding: 24px; background: #1b2029;
          border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  h1 { font-size: 20px; margin: 0 0 16px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; margin: 6px 0; border-radius: 8px;
          border: 1px solid #333b48; background: #12161d; color: #e8eaed; font-size: 14px; }
  button { width: 100%; padding: 11px; margin-top: 10px; border: 0; border-radius: 8px;
           background: #3b82f6; color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #msg { min-height: 18px; margin: 10px 0 0; font-size: 13px; color: #f7a; }
  #msg.ok { color: #6ee7a8; }
  a { display: inline-block; margin-top: 14px; color: #7cb0ff; font-size: 13px; text-decoration: none; }
</style>
</head>
<body data-state="__STATE__" data-callback-base="__CALLBACK_BASE__">
<div class="card">
  <h1 id="title">Sign in</h1>
  <form id="form" autocomplete="on">
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button id="submit" type="submit">Sign in</button>
  </form>
  <p id="msg"></p>
  <a href="#" id="toggle">Create account</a>
</div>
<script>
  const STATE = document.body.dataset.state || "";
  const CALLBACK_BASE = document.body.dataset.callbackBase || "";
  const el = (id) => document.getElementById(id);
  let mode = "login";

  const setMode = (next) => {
    mode = next;
    el("title").textContent = mode === "login" ? "Sign in" : "Create account";
    el("submit").textContent = mode === "login" ? "Sign in" : "Register";
    el("toggle").textContent = mode === "login" ? "Create account" : "I already have an account";
    el("password").setAttribute("autocomplete", mode === "login" ? "current-password" : "new-password");
  };

  el("toggle").addEventListener("click", (e) => {
    e.preventDefault();
    setMode(mode === "login" ? "register" : "login");
    const msg = el("msg"); msg.textContent = ""; msg.className = "";
  });

  el("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = el("msg"); msg.textContent = ""; msg.className = "";
    el("submit").disabled = true;
    const isRegister = mode === "register";
    const payload = JSON.stringify({ email: el("email").value, password: el("password").value });
    const path = isRegister ? "/v1/auth/email/register" : "/v1/auth/email/login";
    try {
      const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: payload });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        msg.textContent = data.resultMessage || "Request failed";
        el("submit").disabled = false;
        return;
      }
      // Registration does not sign in: switch back to the sign-in form.
      if (isRegister) {
        setMode("login");
        el("password").value = "";
        el("submit").disabled = false;
        msg.className = "ok";
        msg.textContent = "Account created. Please sign in.";
        return;
      }
      if (!data.authToken) {
        msg.textContent = data.resultMessage || "Authentication failed";
        el("submit").disabled = false;
        return;
      }
      const url = CALLBACK_BASE + "?isSuccess=true&state=" + encodeURIComponent(STATE) +
                  "&authToken=" + encodeURIComponent(data.authToken) + "&error=0";
      await fetch(url).catch(() => {});
      // Signed in: remove the form so there is nothing left to interact with.
      el("form").style.display = "none";
      el("toggle").style.display = "none";
      el("title").textContent = "Signed in";
      msg.className = "ok";
      msg.textContent = "Signed in successfully. You can return to the game.";
    } catch (err) {
      msg.textContent = "Network error";
      el("submit").disabled = false;
    }
  });
</script>
</body>
</html>
